mixed-port: 7890

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - ali-jp
      - aws-us

proxies:
  - name: "ali-jp"
    type: vless
    server: 8.209.242.121
    port: 443
    udp: true
    uuid: mag1cian
    flow: xtls-rprx-vision
    packet-encoding: ""

    tls: true
    servername: developer.mozilla.org
    # alpn:
    # fingerprint: chrome
    client-fingerprint: chrome
    skip-cert-verify: true
    reality-opts:
      public-key: 4-rbY6ItUutAV13q9VdEcWtCc2H2C382F4Y7IwfCwQw
      short-id: ffffeeee
    encryption: "none"

    network: tcp

    smux:
      enabled: false
  - name: "aws-us"
    type: vless
    server: 54.213.218.196
    port: 443
    udp: true
    uuid: ee7381ee-db2b-404c-b7fc-87f5369a7643
    flow: xtls-rprx-vision
    packet-encoding: ""

    tls: true
    servername: developer.mozilla.org
    # alpn:
    # fingerprint: chrome
    client-fingerprint: chrome
    skip-cert-verify: true
    reality-opts:
      public-key: 4-rbY6ItUutAV13q9VdEcWtCc2H2C382F4Y7IwfCwQw
      short-id: ffff
    encryption: "none"

    network: tcp

    smux:
      enabled: false

